name: fetch-hfood
# 건강기능식품 원료별 인정 기능성 문구 받기 (식품안전나라 OpenAPI). 수동 실행만. 결과는 data/hfood/raw 에 커밋.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 받기
        env:
          KEY: ${{ secrets.FOODSAFETY_KEY }}
        run: |
          K=${KEY:-sample}; mkdir -p data/hfood/raw
          python3 - "$K" <<'PY'
          import json, sys, time, urllib.request
          K = sys.argv[1]; STEP = 5 if K == "sample" else 1000
          print(f"::notice title=key::{'저장소 키 사용' if K != 'sample' else '샘플 키(5건 제한)'}")
          def get(u):
              for t in range(4):
                  try: return json.load(urllib.request.urlopen(u, timeout=120))
                  except Exception as e: err = e; time.sleep(5 * (t + 1))
              raise err
          for svc in ["I2710", "I-0050", "I-0040"]:
              rows, start, total = [], 1, None
              while total is None or start <= total:
                  d = get(f"http://openapi.foodsafetykorea.go.kr/api/{K}/{svc}/json/{start}/{start+STEP-1}").get(svc, {})
                  total = int(d.get("total_count", 0) or 0); got = d.get("row", [])
                  print(f"::notice title={svc}::{start} total={total} got={len(got)} {d.get('RESULT')}")
                  if not got: break
                  rows += got; start += STEP; time.sleep(0.5)
              if rows: json.dump(rows, open(f"data/hfood/raw/{svc}.json", "w"), ensure_ascii=False, indent=0)
          # 실제 신고된 제품(C003): 원재료 목록 + 제품의 기능성 — 대조 기능 평가용으로 2020년 이후 신고 제품 일부만 저장
          import random
          rows, start, total = [], 1, None
          while K != "sample" and (total is None or start <= total):
              d = get(f"http://openapi.foodsafetykorea.go.kr/api/{K}/C003/json/{start}/{start+999}").get("C003", {})
              total = int(d.get("total_count", 0) or 0); got = d.get("row", [])
              if not got: break
              rows += [{k: r.get(k, "") for k in ("PRDLST_REPORT_NO", "PRDLST_NM", "PRMS_DT", "RAWMTRL_NM", "PRIMARY_FNCLTY")} for r in got]
              start += 1000; time.sleep(0.5)
          print(f"::notice title=C003::total={total} got={len(rows)}")
          recent = [r for r in rows if r["PRMS_DT"] >= "20200101" and r["PRIMARY_FNCLTY"].strip()]
          random.Random(7).shuffle(recent)
          if recent: json.dump(recent[:3000], open("data/hfood/raw/C003_sample.json", "w"), ensure_ascii=False, indent=0)
          PY
      - name: 커밋
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add data/hfood/raw && git commit -m "건기식 인정 문구 원본 받기 (식품안전나라 OpenAPI)" && git push || echo "변경 없음"
