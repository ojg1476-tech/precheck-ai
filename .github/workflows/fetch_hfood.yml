name: fetch-hfood
# 건강기능식품 원료별 인정 기능성 문구 받기 (식품안전나라 OpenAPI). 수동 실행만. 결과는 data/hfood/raw 에 커밋.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 받기
        env:
          KEY: ${{ secrets.FOODSAFETY_KEY }}
        run: |
          K=${KEY:-sample}; mkdir -p data/hfood/raw
          python3 - "$K" <<'PY'
          import json, sys, time, urllib.request
          K = sys.argv[1]; STEP = 5 if K == "sample" else 1000
          for svc in ["I2710", "I-0050", "I-0040"]:
              rows, start, total = [], 1, None
              while total is None or start <= total:
                  u = f"http://openapi.foodsafetykorea.go.kr/api/{K}/{svc}/json/{start}/{start+STEP-1}"
                  d = json.load(urllib.request.urlopen(u, timeout=120))[svc]
                  total = int(d.get("total_count", 0)); got = d.get("row", [])
                  (start == 1 or not got or start % 200 == 1) and print(f"::notice title={svc}::{start} total={total} got={len(got)} {d.get('RESULT')}")
                  if not got: break
                  rows += got; start += STEP; time.sleep(0.3)
              json.dump(rows, open(f"data/hfood/raw/{svc}.json", "w"), ensure_ascii=False, indent=0)
          PY
      - name: 커밋
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add data/hfood/raw && git commit -m "건기식 인정 문구 원본 받기 (식품안전나라 OpenAPI)" && git push || echo "변경 없음"
