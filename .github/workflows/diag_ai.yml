name: diag-ai
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q "optimum[onnxruntime]" sentence-transformers tokenizers
      - run: optimum-cli export onnx --model jhgan/ko-sroberta-multitask --task feature-extraction /tmp/onnx
      - run: python tools/diag_ai.py
