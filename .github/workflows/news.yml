name: news
# 매일 아침 식약처 보도자료에서 화장품·식품 광고 소식을 모아 web/news.json을 갱신한다.
on:
  schedule:
    - cron: "17 0 * * *"   # 매일 09:17 (한국 시간)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "저장하지 않고 결과만 보기"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 소식 모으기
        run: python tools/update_news.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: 시즌 데이터 다시 만들기
        run: python tools/build_season.py
      - name: 바뀐 것이 있으면 커밋
        run: |
          if git diff --quiet -- web/news.json web/season.json; then echo "변경 없음"; exit 0; fi
          git config user.name "moonguradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/news.json web/season.json
          git commit -m "소식 자동 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
