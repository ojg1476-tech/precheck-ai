name: fetch-cos
# 기능성화장품 보고 품목(공공데이터포털)을 매주 다시 받아 대조 표를 새로 만든다.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 19 * * 0"   # 매주 월요일 04:23 (한국 시간)
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 기능성화장품 보고 품목 전체 받기
        env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          mkdir -p data/cos/raw
          python3 - <<'PY'
          import gzip, json, os, time, urllib.request
          K = os.environ["KEY"]; base = "https://apis.data.go.kr/1471000/FtnltCosmRptPrdlstInfoService01/getRptPrdlstInq01"
          KEEP = ("COSMETIC_REPORT_SEQ", "ITEM_NAME", "ENTP_NAME", "REPORT_DATE", "REPORT_FLAG_NAME", "COSMETIC_TARGET_FLAG_NAME",
                  "EFFECT_YN1", "EFFECT_YN2", "EFFECT_YN3", "SPF", "PA", "WATER_PROOFING_NAME", "EE_CODE", "EE_NAME", "USAGE_DOSAGE", "CANCEL_APPROVAL_YN")
          def get(page, n):
              for t in range(6):
                  try:
                      return json.load(urllib.request.urlopen(f"{base}?serviceKey={K}&pageNo={page}&numOfRows={n}&type=json", timeout=90))["body"]
                  except Exception as e:
                      err = e; time.sleep(5 * (t + 1))
              raise err
          N = 500
          b = get(1, N); total = int(b["totalCount"]); got = len(b.get("items") or [])
          print(f"::notice title=first::total={total} 한 번에 {got}건")
          if got < N: N = got
          rows = list(b["items"]); page = 2
          fails = []
          while len(rows) + len(fails) * N < total:
              try:
                  items = get(page, N).get("items") or []
              except Exception as e:   # 한 쪽이 끝내 안 되면 건너뛰고 나중에 다시
                  fails.append(page); page += 1; continue
              if not items: break
              rows += items; page += 1; time.sleep(0.2)
          for pg in list(fails):
              try:
                  rows += get(pg, N).get("items") or []; fails.remove(pg)
              except Exception:
                  pass
          print(f"::notice title=missing pages::{fails}")
          slim = [{k: r.get(k) for k in KEEP} for r in rows]
          with gzip.open("data/cos/raw/reports.json.gz", "wt", encoding="utf-8", compresslevel=9) as f:
              json.dump(slim, f, ensure_ascii=False, separators=(",", ":"))
          import collections
          for k in ("EFFECT_YN1", "EFFECT_YN2", "EFFECT_YN3", "EE_NAME", "COSMETIC_TARGET_FLAG_NAME", "CANCEL_APPROVAL_YN"):
              print(f"::notice title={k}::{collections.Counter(str(r.get(k)) for r in slim).most_common(25)}")
          print(f"::notice title=saved::{len(slim)}건 (호출 {page}번)")
          PY
      - name: 대조 표 만들기
        run: python3 tools/build_cos_products.py
      - name: 커밋
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add data/cos/raw rules/cos_products.json web/cos_products.json && git commit -m "기능성화장품 보고 품목 다시 받기 (공공데이터포털, 매주)" && git pull --rebase && git push || echo "변경 없음"
