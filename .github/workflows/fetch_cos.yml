name: fetch-cos
# 화장품 공공데이터(공공데이터포털) 확인·받기. 수동 실행만.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 어떤 서비스가 열리는지 확인
        env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          K = os.environ.get("KEY", "")
          print(f"::notice title=key::{'키 있음' if K else '키 없음'} 길이 {len(K)}")
          # 공공데이터포털이 공개하는 이 데이터의 명세(swagger)에서 실제 주소·기능 이름을 읽는다
          for u in ["https://www.data.go.kr/catalog/15095680/openapi.json", "https://www.data.go.kr/data/15095680/openapi.do"]:
              try:
                  body = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=60).read().decode("utf-8", "replace")
                  import re as _re
                  hits = sorted(set(_re.findall(r"apis\.data\.go\.kr/[A-Za-z0-9_/]+|1471000/[A-Za-z0-9_/]+|\"/[A-Za-z]+[A-Za-z0-9_]*\"\s*:", body)))
                  print(f"::notice title=raw {u[-30:]} len={len(body)}::{hits[:40]} || {body[:800].replace(chr(10),' ')}")
              except Exception as e:
                  print(f"::notice title=raw error::{e}")
          try:
              spec = json.load(urllib.request.urlopen("https://www.data.go.kr/catalog/15095680/openapi.json", timeout=60))
              host = spec.get("host", ""); bp = spec.get("basePath", ""); servers = [x.get("url") for x in spec.get("servers", [])]
              paths = list(spec.get("paths", {}).keys())
              print(f"::notice title=spec::host={host} basePath={bp} servers={servers} paths={paths}")
              for pth, ops in spec.get("paths", {}).items():
                  for m, op in ops.items():
                      params = [q.get("name") for q in op.get("parameters", [])]
                      print(f"::notice title=op {pth}::{op.get('summary','')} params={params}")
          except Exception as e:
              print(f"::notice title=spec error::{e}")
          base = "https://apis.data.go.kr/1471000"
          # 서비스 경로 후보 (식약처 화장품 관련)
          cands = ["FtnltCosmRptPrdlstInfoService01/getRptPrdlstInq01", "FtnltCosmRptPrdlstInfoService01/getRptEntpInq01", "FtnltCosmRptPrdlstInfoService/getRptPrdlstInq", "FtnltCosmRptPrdlstInfoService01/getRptPrdlstInq",
                   "FtnltCosmRptPrdlstInfoService02/getRptPrdlstInq", "FtnltCosmRptPrdlstInfoService/getRptPrdlstInfo",
                   "CsmtcsMtrlInfoService/getCsmtcsMtrlInfo", "CosmeticRegulationInfoService/getCosmeticRegulationInfo"]
          for c in cands:
              for k in (K, urllib.parse.quote(K, safe="")):
                  u = f"{base}/{c}?serviceKey={k}&pageNo=1&numOfRows=3&type=json"
                  try:
                      r = urllib.request.urlopen(u, timeout=60); body = r.read().decode("utf-8", "replace")
                      code = r.status
                  except Exception as e:
                      body = getattr(e, "read", lambda: b"")().decode("utf-8", "replace") if hasattr(e, "read") else str(e); code = getattr(e, "code", "ERR")
                  print(f"::notice title={c} {code}::{body[:1500].replace(chr(10), ' ')}")
                  if code == 200 and "SERVICE_KEY" not in body:
                      break
          PY

      - name: 칸 의미 살펴보기
        env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, collections, urllib.request
          K = os.environ["KEY"]; base = "https://apis.data.go.kr/1471000/FtnltCosmRptPrdlstInfoService01/getRptPrdlstInq01"
          rows = []
          for page in (1, 300, 900, 1500, 1900):
              u = f"{base}?serviceKey={K}&pageNo={page}&numOfRows=100&type=json"
              try:
                  d = json.load(urllib.request.urlopen(u, timeout=60)); rows += d["body"]["items"]
              except Exception as e:
                  print(f"::notice title=err {page}::{e}")
          print(f"::notice title=n::{len(rows)} keys={list(rows[0].keys()) if rows else []}")
          for k in ["REPORT_FLAG_NAME", "COSMETIC_TARGET_FLAG_NAME", "COSMETIC_STD_NAME", "EFFECT_YN1", "EFFECT_YN2", "EFFECT_YN3", "EE_CODE", "EE_NAME", "WATER_PROOFING_NAME", "CANCEL_APPROVAL_YN"]:
              c = collections.Counter(str(r.get(k)) for r in rows)
              print(f"::notice title={k}::{c.most_common(15)}")
          combo = collections.Counter((r.get("EFFECT_YN1"), r.get("EFFECT_YN2"), r.get("EFFECT_YN3"), bool(r.get("SPF"))) for r in rows)
          print(f"::notice title=combo::{combo.most_common(12)}")
          ex = [{k: r.get(k) for k in ("ITEM_NAME", "EFFECT_YN1", "EFFECT_YN2", "EFFECT_YN3", "SPF", "PA", "EE_NAME", "USAGE_DOSAGE", "EE_DOC_DATA")} for r in rows if r.get("EE_NAME") or r.get("EE_DOC_DATA")][:6]
          print(f"::notice title=ex::{json.dumps(ex, ensure_ascii=False)[:3500]}")
          ex2 = [{k: r.get(k) for k in ("ITEM_NAME", "EFFECT_YN1", "EFFECT_YN2", "EFFECT_YN3", "SPF", "PA")} for r in rows][::40]
          print(f"::notice title=ex2::{json.dumps(ex2, ensure_ascii=False)[:3500]}")
          PY

      - name: 기능성화장품 보고 품목 전체 받기
        env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          mkdir -p data/cos/raw
          python3 - <<'PY'
          import gzip, json, os, time, urllib.request
          K = os.environ["KEY"]; base = "https://apis.data.go.kr/1471000/FtnltCosmRptPrdlstInfoService01/getRptPrdlstInq01"
          KEEP = ("COSMETIC_REPORT_SEQ", "ITEM_NAME", "ENTP_NAME", "REPORT_DATE", "REPORT_FLAG_NAME", "COSMETIC_TARGET_FLAG_NAME",
                  "EFFECT_YN1", "EFFECT_YN2", "EFFECT_YN3", "SPF", "PA", "WATER_PROOFING_NAME", "EE_CODE", "EE_NAME", "USAGE_DOSAGE", "CANCEL_APPROVAL_YN")
          def get(page, n):
              for t in range(4):
                  try:
                      return json.load(urllib.request.urlopen(f"{base}?serviceKey={K}&pageNo={page}&numOfRows={n}&type=json", timeout=120))["body"]
                  except Exception as e:
                      err = e; time.sleep(5 * (t + 1))
              raise err
          N = 1000
          b = get(1, N); total = int(b["totalCount"]); got = len(b.get("items") or [])
          print(f"::notice title=first::total={total} 한 번에 {got}건")
          if got < N: N = got
          rows = list(b["items"]); page = 2
          while len(rows) < total:
              items = get(page, N).get("items") or []
              if not items: break
              rows += items; page += 1; time.sleep(0.2)
          slim = [{k: r.get(k) for k in KEEP} for r in rows]
          with gzip.open("data/cos/raw/reports.json.gz", "wt", encoding="utf-8", compresslevel=9) as f:
              json.dump(slim, f, ensure_ascii=False, separators=(",", ":"))
          import collections
          for k in ("EFFECT_YN1", "EFFECT_YN2", "EFFECT_YN3", "EE_NAME", "COSMETIC_TARGET_FLAG_NAME", "CANCEL_APPROVAL_YN"):
              print(f"::notice title={k}::{collections.Counter(str(r.get(k)) for r in slim).most_common(25)}")
          print(f"::notice title=saved::{len(slim)}건 (호출 {page}번)")
          PY
      - name: 커밋
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add data/cos/raw && git commit -m "기능성화장품 보고 품목 원본 받기 (공공데이터포털)" && git pull --rebase && git push || echo "변경 없음"
