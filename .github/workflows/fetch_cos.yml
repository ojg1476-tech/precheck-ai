name: fetch-cos
# 화장품 공공데이터(공공데이터포털) 확인·받기. 수동 실행만.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 어떤 서비스가 열리는지 확인
        env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          K = os.environ.get("KEY", "")
          print(f"::notice title=key::{'키 있음' if K else '키 없음'} 길이 {len(K)}")
          # 공공데이터포털이 공개하는 이 데이터의 명세(swagger)에서 실제 주소·기능 이름을 읽는다
          for u in ["https://www.data.go.kr/catalog/15095680/openapi.json", "https://www.data.go.kr/data/15095680/openapi.do"]:
              try:
                  body = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=60).read().decode("utf-8", "replace")
                  import re as _re
                  hits = sorted(set(_re.findall(r"apis\.data\.go\.kr/[A-Za-z0-9_/]+|1471000/[A-Za-z0-9_/]+|\"/[A-Za-z]+[A-Za-z0-9_]*\"\s*:", body)))
                  print(f"::notice title=raw {u[-30:]} len={len(body)}::{hits[:40]} || {body[:800].replace(chr(10),' ')}")
              except Exception as e:
                  print(f"::notice title=raw error::{e}")
          try:
              spec = json.load(urllib.request.urlopen("https://www.data.go.kr/catalog/15095680/openapi.json", timeout=60))
              host = spec.get("host", ""); bp = spec.get("basePath", ""); servers = [x.get("url") for x in spec.get("servers", [])]
              paths = list(spec.get("paths", {}).keys())
              print(f"::notice title=spec::host={host} basePath={bp} servers={servers} paths={paths}")
              for pth, ops in spec.get("paths", {}).items():
                  for m, op in ops.items():
                      params = [q.get("name") for q in op.get("parameters", [])]
                      print(f"::notice title=op {pth}::{op.get('summary','')} params={params}")
          except Exception as e:
              print(f"::notice title=spec error::{e}")
          base = "https://apis.data.go.kr/1471000"
          # 서비스 경로 후보 (식약처 화장품 관련)
          cands = ["FtnltCosmRptPrdlstInfoService/getRptPrdlstInq", "FtnltCosmRptPrdlstInfoService01/getRptPrdlstInq",
                   "FtnltCosmRptPrdlstInfoService02/getRptPrdlstInq", "FtnltCosmRptPrdlstInfoService/getRptPrdlstInfo",
                   "CsmtcsMtrlInfoService/getCsmtcsMtrlInfo", "CosmeticRegulationInfoService/getCosmeticRegulationInfo"]
          for c in cands:
              for k in (K, urllib.parse.quote(K, safe="")):
                  u = f"{base}/{c}?serviceKey={k}&pageNo=1&numOfRows=3&type=json"
                  try:
                      r = urllib.request.urlopen(u, timeout=60); body = r.read().decode("utf-8", "replace")
                      code = r.status
                  except Exception as e:
                      body = getattr(e, "read", lambda: b"")().decode("utf-8", "replace") if hasattr(e, "read") else str(e); code = getattr(e, "code", "ERR")
                  print(f"::notice title={c} {code}::{body[:1500].replace(chr(10), ' ')}")
                  if code == 200 and "SERVICE_KEY" not in body:
                      break
          PY
